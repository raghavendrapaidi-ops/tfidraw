<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TollyDraw – Draw &amp; Guess Telugu Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- HOME -->
<section id="home" class="screen active">
  <div class="home-card">
    <div class="logo"><span class="clap">🎬</span><h1>Tolly<b>Draw</b></h1></div>
    <p class="tag">Draw it. Guess it. Telugu cinema edition.</p>
    <label class="field">Your name
      <input id="name" maxlength="16" placeholder="e.g. Prabhas fan" autocomplete="off">
    </label>
    <button id="btnCreate" class="btn primary">Create Room</button>
    <button id="btnQuick" class="btn">Play with Strangers</button>
    <div class="or"><span>or join a friend</span></div>
    <div class="row">
      <input id="code" maxlength="4" placeholder="CODE" autocomplete="off">
      <button id="btnJoin" class="btn accent">Join</button>
    </div>
    <p id="homeErr" class="err"></p>
    <p class="how">One person draws a movie title, everyone else guesses it in the chat — faster guesses score more!</p>
  </div>
</section>

<!-- LOBBY -->
<section id="lobby" class="screen">
  <div class="panel lobby-card">
    <h2>Room <span id="lobbyCode" class="code"></span></h2>
    <div class="invite">
      <input id="inviteLink" readonly>
      <button id="btnCopy" class="btn small">Copy link</button>
    </div>
    <h3>Players <span id="plCount"></span></h3>
    <ul id="lobbyPlayers" class="plist"></ul>
    <div id="settingsBox" class="settings">
      <label>Rounds
        <select id="setRounds"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>8</option><option>10</option></select>
      </label>
      <label>Draw time
        <select id="setTime"><option value="40">40s</option><option value="60">60s</option><option value="80" selected>80s</option><option value="100">100s</option><option value="120">120s</option><option value="180">180s</option></select>
      </label>
      <label>Movies
        <select id="setPool"><option value="popular" selected>Popular hits</option><option value="all">Everything (hard!)</option></select>
      </label>
    </div>
    <p id="settingsRO" class="muted"></p>
    <button id="btnStart" class="btn primary big">Start Game</button>
    <p id="lobbyMsg" class="muted"></p>
    <button id="btnLeaveLobby" class="linkbtn">Leave room</button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <header class="topbar">
    <div class="round" id="roundInfo">Round 1/3</div>
    <div class="hintwrap">
      <div id="hintLabel" class="hintlabel">GUESS THE MOVIE</div>
      <div id="hint" class="hint"></div>
    </div>
    <div class="timer" id="timer">0</div>
  </header>

  <div class="layout">
    <aside class="players panel">
      <ul id="gamePlayers" class="plist game"></ul>
    </aside>

    <main class="center">
      <div class="canvaswrap">
        <canvas id="cv" width="800" height="600"></canvas>
        <div id="overlay" class="overlay hidden"></div>
      </div>
      <div id="tools" class="tools hidden">
        <div id="palette" class="palette"></div>
        <div class="sizes" id="sizes"></div>
        <button class="tool" id="tPen" title="Pen">✏️</button>
        <button class="tool" id="tFill" title="Fill">🪣</button>
        <button class="tool" id="tEraser" title="Eraser">🧽</button>
        <button class="tool" id="tUndo" title="Undo">↩️</button>
        <button class="tool" id="tClear" title="Clear">🗑️</button>
      </div>
    </main>

    <aside class="chat panel">
      <div id="chatLog" class="chatlog"></div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" maxlength="100" placeholder="Type your guess here…">
        <button class="btn small accent">Send</button>
      </form>
    </aside>
  </div>
</section>

<div id="toast" class="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
